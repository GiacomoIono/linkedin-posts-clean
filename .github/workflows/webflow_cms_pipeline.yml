name: Webflow CMS Pipeline
concurrency:
  group: webflow-cms-pipeline
  cancel-in-progress: false

on:
  schedule:
    # GitHub schedules use UTC. 00:17 UTC avoids the busiest top-of-hour slot.
    - cron: '17 0 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  publish-cms:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Check required GitHub configuration before paid work
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_READ_AND_WRITE_BLOG_POSTS }}
          WEBFLOW_SITE_ID: ${{ vars.WEBFLOW_SITE_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in LINKEDIN_ACCESS_TOKEN OPENAI_API_KEY WEBFLOW_API_TOKEN WEBFLOW_SITE_ID; do
            value="${!name:-}"
            if [ -z "${value//[[:space:]]/}" ]; then
              echo "::error::Required GitHub configuration is missing: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Set the three Actions secrets (Webflow: WEBFLOW_READ_AND_WRITE_BLOG_POSTS) and the WEBFLOW_SITE_ID repository variable."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare fallback image when the post has no source image
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-sol
          OPENAI_IMAGE_MODEL: gpt-image-2
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_READ_AND_WRITE_BLOG_POSTS }}
          WEBFLOW_SITE_ID: ${{ vars.WEBFLOW_SITE_ID }}
          WEBFLOW_COLLECTION_ID: '63250855178122098387d7ef'
          FORCE_WEBFLOW_SYNC: 'false'
        run: |
          set +e
          python -m pipeline.prepare_image
          status=$?
          set -e

          if [ "$status" -eq 2 ]; then
            echo "No recent LinkedIn posts found. No fallback image is needed."
            exit 0
          fi

          exit "$status"

      - name: Commit generated fallback image before Webflow sync
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          git config rebase.autoStash true

          changed_files=$(git status --porcelain -- \
            images/generated \
            data/generated_main_images.json)

          if [ -z "$changed_files" ]; then
            echo "No generated fallback image changes to commit."
            exit 0
          fi

          echo "Generated fallback image changes:"
          echo "$changed_files"

          git add -- \
            images/generated \
            data/generated_main_images.json
          git commit -m "chore(bot): add generated fallback image for $(date -u +'%Y-%m-%d')"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Run Webflow CMS pipeline
        id: pipeline
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-sol
          OPENAI_IMAGE_MODEL: gpt-image-2
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_READ_AND_WRITE_BLOG_POSTS }}
          WEBFLOW_SITE_ID: ${{ vars.WEBFLOW_SITE_ID }}
          WEBFLOW_COLLECTION_ID: '63250855178122098387d7ef'
          WEBFLOW_PUBLISH: 'true'
          FORCE_WEBFLOW_SYNC: 'false'
        run: |
          set +e
          python -m pipeline.main
          status=$?
          set -e

          if [ "$status" -eq 2 ]; then
            echo "No recent LinkedIn posts found. Nothing to publish."
            exit 0
          fi

          exit "$status"

      # Preserve uploads and verification intent even when a later pipeline step fails.
      # The failed pipeline step remains failed; partial post outputs are excluded.
      - name: Save Webflow recovery state after a pipeline failure
        if: ${{ !cancelled() && steps.pipeline.outcome == 'failure' }}
        run: |
          set -euo pipefail
          recovery_files=()
          for candidate in data/webflow_assets.json data/webflow_items.json; do
            if [ -f "$candidate" ]; then
              recovery_files+=("$candidate")
            fi
          done
          if [ "${#recovery_files[@]}" -eq 0 ]; then
            echo "No Webflow recovery files to save."
            exit 0
          fi
          if [ -z "$(git status --porcelain -- "${recovery_files[@]}")" ]; then
            echo "No Webflow recovery state changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config rebase.autoStash true
          git add -- "${recovery_files[@]}"
          git commit -m "chore(bot): preserve Webflow upload and verification progress"
          git fetch origin main
          if ! git rebase origin/main; then
            echo "::error::Webflow recovery state rebase failed. Resolve the conflict before retrying."
            git rebase --abort || true
            exit 1
          fi
          git push origin HEAD:main

      - name: Commit and push pipeline outputs
        if: ${{ success() && steps.pipeline.outcome == 'success' }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          git config rebase.autoStash true

          changed_files=$(git status --porcelain -- \
            data \
            images)

          if [ -z "$changed_files" ]; then
            echo "No pipeline output changes to commit."
            exit 0
          fi

          echo "Changed files:"
          echo "$changed_files"

          git add -- \
            data \
            images

          git commit -m "chore(bot): update Webflow CMS pipeline outputs for $(date -u +'%Y-%m-%d')"

          git fetch origin main
          if ! git rebase origin/main; then
            echo "::error::Pipeline output rebase failed. Resolve the conflict before retrying."
            git rebase --abort || true
            exit 1
          fi

          if git diff --quiet HEAD origin/main; then
            echo "Nothing new to push (already up to date)."
            exit 0
          fi

          git push origin HEAD:main

      - name: Keep Webflow recovery state as a failed-run artifact
        if: ${{ failure() && (steps.pipeline.outcome == 'failure' || steps.pipeline.outcome == 'success') }}
        uses: actions/upload-artifact@v4
        with:
          name: webflow-recovery-state
          path: |
            data/webflow_assets.json
            data/webflow_items.json
          if-no-files-found: ignore
          retention-days: 7
