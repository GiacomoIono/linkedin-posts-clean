name: Validate LinkedIn Fetch

on:
  pull_request:
    branches:
      - main
    paths:
      - 'pipeline/linkedin.py'
      - 'tests/test_linkedin.py'
      - '.github/workflows/validate_linkedin_fetch.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Test code and call LinkedIn read-only
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run repository tests
        run: python -m unittest discover -s tests -v

      - name: Validate LinkedIn fetch
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os

          from pipeline.linkedin import fetch_latest_linkedin_post

          post = fetch_latest_linkedin_post(os.environ["LINKEDIN_ACCESS_TOKEN"])
          if post:
              print(f"LinkedIn validation succeeded. Recent post found: {post['url']}")
          else:
              print("LinkedIn validation succeeded. No post found in the 48-hour window.")
          PY
