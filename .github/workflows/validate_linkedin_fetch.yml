name: Validate LinkedIn Fetch

on:
  pull_request:
    branches:
      - main
    paths:
      - 'pipeline/**'
      - 'tests/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/validate_linkedin_fetch.yml'
      - '.github/workflows/webflow_cms_pipeline.yml'
  workflow_dispatch:
    inputs:
      live_linkedin_check:
        description: Call LinkedIn read-only after the unit tests
        required: true
        default: true
        type: boolean
      live_image_smoke:
        description: Generate one paid JPEG preview without Webflow or Git writes
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Test code and optionally call LinkedIn read-only
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out PR code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run repository tests
        run: python -m unittest discover -s tests -v

      - name: Validate LinkedIn fetch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_linkedin_check }}
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os

          from pipeline.linkedin import fetch_latest_linkedin_post

          post = fetch_latest_linkedin_post(os.environ["LINKEDIN_ACCESS_TOKEN"])
          if post:
              print(f"LinkedIn validation succeeded. Recent post found: {post['url']}")
          else:
              print("LinkedIn validation succeeded. No post found in the 48-hour window.")
          PY

      - name: Generate isolated JPEG smoke-test preview
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_image_smoke }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: gpt-image-2
        run: |
          python - <<'PY'
          from pipeline.config import ensure_directories, load_config
          from pipeline.image_generation import generate_missing_main_image

          ensure_directories()
          post = {
              "content": "<p>AI is changing how marketers discover, evaluate, and act on information.</p>",
              "headline": "AI changes the marketing decision journey",
              "url": "https://www.linkedin.com/feed/update/urn:li:ugcPost:9999999999999999999",
              "published_at": "2099-01-01T10:00:00",
              "images": [],
          }
          result = generate_missing_main_image(post, load_config())
          print(f"Image smoke test completed: {result['action']} at {result['path']}")
          PY

      - name: Upload isolated JPEG preview
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_image_smoke }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-main-image-smoke-test
          path: images/2099-01-01.jpeg
          if-no-files-found: error
          retention-days: 1
